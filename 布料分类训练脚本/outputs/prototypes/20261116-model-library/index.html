<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布料分类 · 两阶段训练与模型库草图</title>
<style>
:root{color-scheme:light dark;--app-bg:light-dark(#f4f6fa,#0d121c);--app-panel:light-dark(#fff,#141d2b);--app-nav:light-dark(#edf1f7,#101826);--app-text:light-dark(#172439,#e4ebf5);--app-muted:light-dark(#637188,#96a6bf);--app-line:light-dark(#dce3ee,#29384d);--app-accent:light-dark(#235fbd,#91b7ff);--app-select:light-dark(#eaf1ff,#223552);--app-good:light-dark(#267451,#8bceb4);--app-warn:light-dark(#946c22,#e2bd74)}
*{box-sizing:border-box}body{margin:0;background:var(--app-bg);color:var(--app-text);font:14px/1.6 "Noto Sans CJK SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--app-line);border-radius:7px;background:var(--app-panel);padding:7px 13px}button:hover{background:var(--app-select)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--app-accent);outline-offset:2px}button.primary{background:var(--app-accent);color:var(--app-bg);border-color:var(--app-accent)}button:disabled{opacity:.45;cursor:default}input,select{border:1px solid var(--app-line);border-radius:6px;background:var(--app-bg);padding:8px 10px}input[type=checkbox]{accent-color:var(--app-accent)}h1,h2,h3,p{margin:0}h1{font-size:25px;font-weight:600}h2{font-size:19px;font-weight:600}h3{font-size:15px;font-weight:600}.muted{color:var(--app-muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.gap{margin-top:20px}.grow{flex:1}.notice{padding:9px 24px;border-bottom:1px solid var(--app-line);color:var(--app-muted);font-size:12px;background:var(--app-panel)}.notice strong{color:var(--app-accent);font-weight:500}.shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:calc(100vh - 38px)}.nav{padding:30px 16px;background:var(--app-nav);border-right:1px solid var(--app-line)}.brand{font-size:20px;font-weight:600;margin:0 8px 4px}.nav button{display:block;width:100%;text-align:left;padding:12px 14px;margin-top:7px;background:transparent;border:0;color:var(--app-muted)}.nav button.active{color:var(--app-text);background:var(--app-select)}.brand-note{margin:0 8px 35px}.nav-foot{margin:50px 8px 0;font-size:12px;color:var(--app-muted)}main{min-width:0;padding:28px 30px}.subtitle{margin-top:5px;color:var(--app-muted)}.page-head{margin-bottom:25px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--app-line);margin-bottom:18px}.tabs button{padding:10px 0;border:0;border-radius:0;background:none;color:var(--app-muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--app-accent);border-bottom-color:var(--app-accent)}.library{display:grid;grid-template-columns:230px minmax(0,1fr);gap:23px}.experiments{border-right:1px solid var(--app-line);padding-right:20px}.experiments button{width:100%;display:block;text-align:left;border:0;background:none;padding:14px 12px;margin-bottom:8px}.experiments button.active{background:var(--app-select)}.exp-name{display:block;font-weight:500}.exp-meta{display:block;font-size:12px;color:var(--app-muted);margin-top:5px}.section-label{font-size:12px;color:var(--app-muted);margin:0 0 12px 10px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:12px;color:var(--app-muted);font-weight:500;padding:12px 11px;border-bottom:1px solid var(--app-line)}td{padding:13px 11px;border-bottom:1px solid var(--app-line)}tbody tr.selected{background:var(--app-select)}td button.model{padding:0;background:none;border:0;text-align:left;color:var(--app-text);font-weight:500}td.num{font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:5px;color:var(--app-muted);font-size:12px;background:var(--app-bg)}.pill.good{color:var(--app-good)}.pill.warn{color:var(--app-warn)}.detail{margin-top:24px;padding-top:19px;border-top:1px solid var(--app-line)}.detail .tabs{margin:12px 0 17px;gap:20px}.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 25px;margin-top:15px}.info-grid dt{color:var(--app-muted);font-size:12px}.info-grid dd{margin:4px 0 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.empty{padding:28px 4px 16px}.empty p{max-width:620px;margin-top:6px;color:var(--app-muted)}.inline-note{padding:12px 0;color:var(--app-muted);font-size:12px}.risk-version{display:flex;gap:15px;align-items:center;padding:12px 0;border-bottom:1px solid var(--app-line)}.risk-version button{text-align:left;flex:1;border:0;background:transparent}.risk-version.active{background:var(--app-select)}.risk-version .version-meta{display:block;font-size:12px;color:var(--app-muted);margin-top:3px}.training-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:30px}.block{padding:20px 0;border-bottom:1px solid var(--app-line)}.block:first-child{padding-top:4px}.option-list{display:flex;gap:20px;flex-wrap:wrap;margin-top:13px}.option-list label{display:flex;gap:7px;align-items:center}.label{display:block;color:var(--app-muted);font-size:12px;margin-bottom:6px}.settings-summary{padding:20px;background:var(--app-panel);border:1px solid var(--app-line);border-radius:9px}.settings-summary dl{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px}.settings-summary dt{color:var(--app-muted)}.settings-summary dd{margin:0}.settings-summary p{margin-top:10px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.settings-grid input,.settings-grid select{width:100%}.settings-grid p{font-size:12px;color:var(--app-muted);margin-top:7px}.status-line{margin-top:24px;padding-top:14px;border-top:1px solid var(--app-line);color:var(--app-muted);font-size:12px}.toast{background:var(--app-select);border:1px solid var(--app-line);padding:12px 16px;border-radius:8px;position:fixed;bottom:20px;right:25px;max-width:420px;z-index:10}.drawer-overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20;padding:20px}.dialog{max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:26px;background:var(--app-panel);border:1px solid var(--app-line);border-radius:12px}.dialog p{margin-top:8px}.dialog label{display:block}.modal-actions{margin-top:24px;display:flex;gap:10px;justify-content:flex-end}[hidden]{display:none!important}.mobile-only{display:none}.search{width:180px}.legacy-title{margin:12px 0 20px}.legacy .pill{color:var(--app-warn)}
@media(min-width:1500px){main{padding:32px 40px}.library{grid-template-columns:250px minmax(0,1fr)}}
@media(max-width:1150px){.shell{grid-template-columns:140px minmax(0,1fr)}main{padding:24px 20px}.library{grid-template-columns:190px minmax(0,1fr);gap:15px}.experiments{padding-right:12px}.training-layout{grid-template-columns:1fr}.settings-summary{margin-top:8px}.info-grid{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.shell{display:block}.nav{padding:12px;border-right:0;border-bottom:1px solid var(--app-line)}.brand{display:inline-block;font-size:18px}.brand-note,.nav-foot{display:none}.nav nav{display:flex;flex-wrap:wrap;margin-top:7px}.nav button{width:auto;margin:0;padding:8px 12px}.library{grid-template-columns:1fr}.experiments{display:flex;flex-wrap:wrap;gap:7px;border:0;padding:0}.experiments .section-label{width:100%;margin:0}.experiments button{width:auto;flex:1;margin:0;min-width:160px}.settings-grid{grid-template-columns:1fr}.page-head{align-items:flex-start}.info-grid{grid-template-columns:1fr 1fr}.notice{padding:9px 15px}main{padding:22px 15px}.tabs{gap:15px}.search{width:150px}}
</style>
</head>
<body>
<div class="notice"><strong>交互草图</strong> · 新版模型、分数和风险状态均为演示数据，不代表已训练成果；所有操作仅改变本页。</div>
<div class="shell">
<aside class="nav"><div class="brand">布料分类</div><div class="brand-note small muted">训练与识别工作台</div><nav aria-label="工作台导航"><button data-page="data">数据集</button><button data-page="train">训练</button><button data-page="library" class="active">模型库</button><button data-page="predict">模型识别</button></nav><div class="nav-foot">先完成整段分类<br>再选择是否研究提前停止</div></aside>
<main id="content"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div><div id="modal" hidden></div>
<script>
(()=>{
const content=document.getElementById('content'),modal=document.getElementById('modal'),toast=document.getElementById('toast');
let page='library',exp='main',selected='TCN-bxby',detailTab='classify',listTab='current',query='',trainingStage='one',selectedRisk=0,noticeTimer;
const models=[
 {id:'GRU-by',model:'GRU',input:'ΔBy',f1:'0.54',accuracy:'55.0%',risk:'未开展',versions:[]},
 {id:'GRU-bxby',model:'GRU',input:'ΔBx＋ΔBy',f1:'0.78',accuracy:'77.5%',risk:'未开展',versions:[]},
 {id:'TCN-by',model:'TCN',input:'ΔBy',f1:'0.60',accuracy:'60.0%',risk:'未开展',versions:[]},
 {id:'TCN-bxby',model:'TCN',input:'ΔBx＋ΔBy',f1:'0.82',accuracy:'未测试',risk:'待校准',versions:[{name:'风险方案02',state:'待校准',date:'11月16日 15:40',desc:'风险头已训练完成；还不能启用提前停止。'},{name:'风险方案01',state:'数据不足',date:'11月16日 14:20',desc:'停止条件没有得到足够的独立采集证据；仍使用完整扫描分类。'}]},
 {id:'CERA-by',model:'CERA',input:'ΔBy',f1:'0.58',accuracy:'57.5%',risk:'未开展',versions:[]},
 {id:'CERA-bxby',model:'CERA',input:'ΔBx＋ΔBy',f1:'0.80',accuracy:'80.0%',risk:'已校准',versions:[{name:'风险方案01',state:'已校准',date:'11月16日 16:10',desc:'此为校准通过状态的界面示例，不代表真实风险保证。'}]}
];
const source=()=>exp==='main'?models:models.map(m=>({...m,id:m.id+'-repeat',f1:'—',accuracy:'未测试',risk:'未开展',versions:[]}));
const chosen=()=>source().find(m=>m.id===selected)||source()[0];
const pill=(s)=>`<span class="pill ${s==='已校准'?'good':s==='待校准'||s==='数据不足'?'warn':''}">${s}</span>`;
const note=(s)=>{toast.textContent=s;toast.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>toast.hidden=true,4500)};
const head=(title,subtitle,actions='')=>`<header class="page-head row between"><div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="row">${actions}</div></header>`;
function library(){
 let html=head('模型库','按实验查找分类模型，风险与提前停止成果归在对应模型下。','<button id="import-demo">导入成果</button><button id="new-experiment" class="primary">新建训练</button>');
 html+=`<div class="tabs" role="tablist" aria-label="成果类型"><button class="${listTab==='current'?'active':''}" data-list="current" role="tab" aria-selected="${listTab==='current'}">当前方案</button><button class="${listTab==='legacy'?'active':''}" data-list="legacy" role="tab" aria-selected="${listTab==='legacy'}">旧版成果</button></div>`;
 if(listTab==='legacy')return html+`<div class="legacy"><h2 class="legacy-title">旧版联合训练 · 只读</h2><p class="muted">与新版纯分类成果分开查看，不归入阶段一。</p><div class="table-wrap gap"><table><thead><tr><th>实验</th><th>输入</th><th>旧版完整准确率</th><th>状态</th></tr></thead><tbody><tr><td>十三类第一次训练</td><td>ΔBx＋ΔBy</td><td>65.38%</td><td>${pill('旧版联合训练')}</td></tr><tr><td>十三类第一次训练</td><td>ΔBy</td><td>5.77%</td><td>${pill('旧版联合训练')}</td></tr><tr><td>十三类第一次训练</td><td>XY模长</td><td>5.77%</td><td>${pill('旧版联合训练')}</td></tr></tbody></table></div><p class="inline-note">这里展示已保存旧训练的摘要。不会与新版整段分类成绩直接排序。</p></div>`;
 html+=`<div class="library"><aside class="experiments" aria-label="实验列表"><p class="section-label">实验 · 2</p><button class="${exp==='main'?'active':''}" data-exp="main"><span class="exp-name">十三类 · 整段分类初试</span><span class="exp-meta">11月16日 · 6个配置 · 单次训练</span></button><button class="${exp==='repeat'?'active':''}" data-exp="repeat"><span class="exp-name">十三类 · 稳定性复验</span><span class="exp-meta">11月16日 · 6个配置 · 每项3次</span></button></aside><section style="min-width:0"><div class="row between" style="margin-bottom:12px"><div><h2>${exp==='main'?'十三类 · 整段分类初试':'十三类 · 稳定性复验'}</h2><p class="small muted">13类 · 每类50个CSV · 训练35 / 验证5 / 测试10 · 整段特征汇总</p></div><input id="search" class="search" aria-label="查找模型或输入" placeholder="查找模型或输入" value="${query}"></div><div class="table-wrap"><table aria-label="分类模型列表"><thead><tr><th>分类模型</th><th>输入信号</th><th>验证F1</th><th>测试准确率</th><th>第二阶段</th></tr></thead><tbody id="model-rows"></tbody></table></div><section id="details" class="detail" aria-live="polite"></section></section></div>`;
 return html;
}
function renderRows(){
 const body=document.getElementById('model-rows');if(!body)return;
 const ms=source().filter(m=>(m.model+' '+m.input).toLowerCase().includes(query.toLowerCase()));
 body.innerHTML=ms.map(m=>`<tr class="${m.id===selected?'selected':''}"><td><button class="model" data-model="${m.id}" aria-pressed="${m.id===selected}">${m.model}</button></td><td>${m.input}</td><td class="num">${m.f1}</td><td class="num">${m.accuracy}</td><td>${pill(m.risk)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">没有匹配的模型</td></tr>';
 renderDetail();
}
function renderDetail(){
 const box=document.getElementById('details');if(!box)return;const m=chosen();
 box.innerHTML=`<div class="row between"><div><h3>${m.model} · ${m.input}</h3><p class="small muted">第一阶段分类模型 · 整段特征汇总${exp==='repeat'?' · 3次复验归在此配置下':''}</p></div><button id="more-model">更多操作</button></div><div class="tabs" role="tablist" aria-label="模型详情"><button data-detail="classify" class="${detailTab==='classify'?'active':''}" role="tab" aria-selected="${detailTab==='classify'}">分类结果</button><button data-detail="risk" class="${detailTab==='risk'?'active':''}" role="tab" aria-selected="${detailTab==='risk'}">风险与提前停止${m.versions.length?' · '+m.versions.length:''}</button><button data-detail="runs" class="${detailTab==='runs'?'active':''}" role="tab" aria-selected="${detailTab==='runs'}">训练记录</button></div><div id="detail-content"></div>`;
 const inner=document.getElementById('detail-content');
 if(detailTab==='classify')inner.innerHTML=`<dl class="info-grid"><div><dt>完整段验证 macro-F1</dt><dd>${m.f1}</dd></div><div><dt>完整段测试准确率</dt><dd>${m.accuracy}</dd></div><div><dt>当前用途</dt><dd>完整扫描分类</dd></div></dl><div class="actions"><button id="classify-load" class="primary">加载完整扫描识别</button><button id="show-report">查看分类报告</button><button id="phase-two">进入第二阶段</button></div><p class="inline-note">第一阶段可以独立使用。进入第二阶段不会更改这份分类模型。</p>`;
 if(detailTab==='risk'){
  if(!m.versions.length)inner.innerHTML=`<div class="empty"><h3>尚未开展第二阶段</h3><p>这份模型可直接用于完整扫描分类。需要研究提前停止时，再选择它并导入独立的风险训练与校准数据。</p><div class="actions"><button id="phase-two" class="primary">为此模型准备第二阶段</button></div></div>`;
  else{
   const v=m.versions[Math.min(selectedRisk,m.versions.length-1)];
   inner.innerHTML=`<p class="small muted">关联分类器：${m.model} · ${m.input} · ${exp==='main'?'初试01':'复验01'}；各风险方案共享同一份冻结分类权重。</p><div class="gap">${m.versions.map((v,i)=>`<div class="risk-version ${i===Math.min(selectedRisk,m.versions.length-1)?'active':''}"><button data-risk="${i}" aria-pressed="${i===Math.min(selectedRisk,m.versions.length-1)}">${v.name}<span class="version-meta">${v.date}</span></button>${pill(v.state)}</div>`).join('')}</div><p class="gap">${v.desc}</p><dl class="info-grid"><div><dt>接受后错误率</dt><dd>—</dd></div><div><dt>平均扫描比例</dt><dd>—</dd></div><div><dt>风险与停止报告</dt><dd>${v.state==='待校准'?'校准后生成':'查看详情'}</dd></div></dl><div class="actions"><button id="risk-action" class="primary">${v.state==='已校准'?'加载提前停止识别':v.state==='待校准'?'准备停止条件校准':'查看不足原因'}</button><button id="phase-two">新建风险方案</button><button id="show-report">查看风险报告</button></div>`;
  }
 }
 if(detailTab==='runs')inner.innerHTML=`<dl class="info-grid"><div><dt>分类训练</dt><dd>仅完整段交叉熵</dd></div><div><dt>学习率 / 每批段数</dt><dd>0.001 / 16</dd></div><div><dt>分类器是否修改</dt><dd>训练后固定保存</dd></div></dl><details class="gap"><summary>${exp==='repeat'?'展开3次复验与各自权重':'展开训练轮次、随机种子和日志'}</summary><p class="inline-note">${exp==='repeat'?'复验01 · 种子42；复验02 · 种子43；复验03 · 种子44。进入第二阶段时需要选择其中一份具体权重，均值不是一个可加载的模型。':'保存最佳验证轮次；测试未参与选模。详细记录不会占用模型主表行。'}</p></details>`;
}
function train(){
 let html=head('训练','两个阶段分别启动。第一阶段完成后，你可以停在分类模型，也可以再研究提前停止。');
 html+=`<div class="tabs" role="tablist" aria-label="训练阶段"><button data-stage="one" class="${trainingStage==='one'?'active':''}" role="tab" aria-selected="${trainingStage==='one'}">阶段一 · 整段分类</button><button data-stage="two" class="${trainingStage==='two'?'active':''}" role="tab" aria-selected="${trainingStage==='two'}">阶段二 · 风险与提前停止</button></div>`;
 if(trainingStage==='two'){
 const m=chosen();return html+`<div class="block"><h2>从已完成的分类模型开始</h2><p class="subtitle">先选择分类器，第二阶段始终关联它的冻结权重。</p><div class="gap row"><strong>${m.model} · ${m.input}</strong><span class="muted">${exp==='main'?'十三类 · 整段分类初试':'十三类 · 稳定性复验'}</span><button id="choose-parent">从模型库选择</button></div></div><div class="block"><h3>先检查不同扫描进度是否有分类能力</h3><p class="subtitle">风险头只学习识别错误风险，不修改分类模型。</p><div class="actions"><button id="prefix-check">准备前缀表现检查</button></div></div><div class="block"><h3>独立数据用途</h3><p class="subtitle">风险头训练与验证、停止条件校准、最终测试分开管理。</p><div class="actions"><button id="risk-data">导入第二阶段数据</button><button id="start-risk" class="primary">开始第二阶段训练</button></div></div><p class="status-line">交互演示：点击不会读取CSV或启动真实训练。</p>`;
 }
 return html+`<div class="training-layout"><section><div class="block"><label class="label" for="experiment-name">实验名称</label><input id="experiment-name" style="width:100%" value="十三类 · 整段分类初试"></div><div class="block"><h3>比较哪些分类主干</h3><div class="option-list">${['GRU','TCN','CERA'].map(x=>`<label><input type="checkbox" class="arch" checked>${x}</label>`).join('')}</div></div><div class="block"><h3>输入信号</h3><div class="option-list"><label><input type="checkbox" class="signal" checked>ΔBy · 主实验</label><label><input type="checkbox" class="signal" checked>ΔBx＋ΔBy · 对照</label><label><input type="checkbox" class="signal">XY模长</label></div></div><div class="block"><h3>训练方式</h3><div class="gap row"><label class="grow"><span class="label">推荐预设</span><select id="preset"><option value="standard">标准训练 · 每项1次</option><option value="repeat">重复验证 · 每项3次</option><option value="quick">快速检查 · 每项1次</option></select></label><span class="muted">整段特征汇总 · 仅完整段分类损失</span></div><details class="gap"><summary>研究对照</summary><label class="gap row"><input id="last-readout" type="checkbox">额外训练“最后时刻读出”对照</label></details></div><div class="actions"><button id="start-classification" class="primary">开始第一阶段训练</button><button id="training-settings">训练设置与说明</button><button id="protocol-settings">采集协议</button></div><p class="status-line" id="job-count"></p></section><aside><div class="settings-summary"><h3>本次设置</h3><dl><dt>最多学习</dt><dd id="epoch-summary">200轮</dd><dt>无进步则结束</dt><dd id="patience-summary">30轮</dd><dt>每批学习</dt><dd>16个单程</dd><dt>学习步长</dt><dd>0.001</dd><dt>数据划分</dt><dd>70% / 10% / 20%</dd></dl><p class="small muted">先用验证集选择模型，最终再查看测试结果。</p><p class="small muted">同一CSV的去回程始终处在同一分区。</p></div></aside></div>`;
}
function predict(){const m=chosen();return head('模型识别','选择用途明确的成果，再导入新的扫描CSV。')+`<div class="block"><h2>${m.model} · ${m.input}</h2><p class="subtitle">${exp==='main'?'十三类 · 整段分类初试':'十三类 · 稳定性复验'}</p><div class="option-list"><label><input type="radio" name="recognition" checked>完整扫描分类</label><label><input type="radio" name="recognition" ${m.risk==='已校准'?'':'disabled'}>提前停止识别${m.risk==='已校准'?'':'（需要已校准成果）'}</label></div><div class="actions"><button id="recognition-csv">导入待识别CSV</button><button id="recognition-start" class="primary">开始识别</button><button id="choose-parent">选择其他模型</button></div></div>`}
function data(){return head('数据集','保留CSV导入与去回程预览，训练前显示每类的独立采集数量。')+`<div class="block"><h2>数据检查与有效段预览</h2><p class="subtitle">去程 step3、回程 step4；只使用已确定的位置范围，原始CSV保持不变。</p><div class="actions"><button id="mock-import-data" class="primary">导入CSV</button><button id="protocol-settings">查看采集协议</button><button id="go-training">进入第一阶段训练</button></div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));content.innerHTML=page==='library'?library():page==='train'?train():page==='predict'?predict():data();if(page==='library'&&listTab==='current')renderRows();if(page==='train'&&trainingStage==='one')updateJobs();}
function updateJobs(){const n=content.querySelectorAll('.arch:checked').length*content.querySelectorAll('.signal:checked').length*(document.getElementById('last-readout').checked?2:1)*(document.getElementById('preset').value==='repeat'?3:1);document.getElementById('job-count').textContent=`本次 ${n} 个训练任务；第二阶段不会自动启动。`;const quick=document.getElementById('preset').value==='quick';document.getElementById('epoch-summary').textContent=quick?'30轮':'200轮';document.getElementById('patience-summary').textContent=quick?'8轮':'30轮';}
function showSettings(protocol=false){
 const fields=protocol?[['去程使用位置','45 → 142 mm','位置窗是当前基准，仍需与真实接触段核对。'],['回程使用位置','114 → 16 mm','回程按采集时间顺序输入，逐轴取绝对值。'],['每毫米电机脉冲','250','优先读取采集元数据，不按分类成绩调换算。'],['固定采样率','333 Hz','与实际采集协议一致。'],['末尾时间余量','200 ms','处理当前固定时长边界，与缺口阈值不同。'],['最大采样缺口','20 ms','最多沿用过去有效采样值的时间。']]:[['最多学习轮数','200','一轮遍历一次训练集；这是上限，不要求全部跑完。'],['多少轮没进步就结束','30','观察验证集完整段F1，避免无效地继续训练。'],['每批学习多少段','16','一次更新使用的单程数。内存不足先减小它。'],['学习步长','0.001','调整参数的幅度；损失震荡时可对照0.0003。'],['参数约束强度','0.0001','权重衰减。约束过强也可能学不好。'],['随机忽略特征比例','0.1','Dropout，只在训练时生效。']];
 modal.className='drawer-overlay';modal.hidden=false;modal.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="row between"><h2 id="dialog-title">${protocol?'采集协议':'训练设置与说明'}</h2><button id="close-modal" aria-label="关闭设置">关闭</button></div><p class="muted">${protocol?'这些参数定义采集数据代表什么，修改后需要重新检查数据。':'每项保留专业参数意义，推荐值可以直接使用。'}</p><div class="settings-grid">${fields.map((x,i)=>`<label><span class="label">${x[0]}</span><input aria-label="${x[0]}" value="${x[1]}"><p>${x[2]}</p></label>`).join('')}</div><div class="modal-actions"><button id="reset-settings">恢复推荐值</button><button id="save-settings" class="primary">保存设置</button></div></section>`;modal.querySelector('button').focus();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.list){listTab=b.dataset.list;render();return}if(b.dataset.exp){exp=b.dataset.exp;selected=exp==='main'?'TCN-bxby':'GRU-by-repeat';detailTab='classify';query='';render();return}if(b.dataset.model){selected=b.dataset.model;selectedRisk=0;renderRows();return}if(b.dataset.detail){detailTab=b.dataset.detail;renderDetail();return}if(b.dataset.risk){selectedRisk=Number(b.dataset.risk);renderDetail();return}if(b.dataset.stage){trainingStage=b.dataset.stage;render();return}
 switch(b.id){
 case 'new-experiment':case 'go-training':page='train';trainingStage='one';render();break;
 case 'phase-two':page='train';trainingStage='two';render();break;
 case 'choose-parent':page='library';listTab='current';render();break;
 case 'classify-load':page='predict';render();break;
 case 'training-settings':showSettings(false);break;case 'protocol-settings':showSettings(true);break;
 case 'close-modal':modal.hidden=true;break;
 case 'save-settings':modal.hidden=true;note('草图中仅演示设置交互，不写入真实训练配置。');break;
 case 'reset-settings':showSettings(document.getElementById('dialog-title').textContent==='采集协议');break;
 case 'more-model':note('正式版在这里集中提供：重命名、导出成果、归档、打开文件夹。');break;
 case 'show-report':note('正式版将打开当前选中成果的专属报告，不混用第一阶段与第二阶段指标。');break;
 case 'start-classification':note('第一阶段训练入口演示。没有启动真实训练；模型库仍为演示数据。');break;
 case 'start-risk':note('第二阶段入口演示。实际训练前需要指定冻结分类权重与独立数据分区。');break;
 case 'risk-action':note('根据选中风险方案的状态进入校准、查看原因或加载提前停止识别。');break;
 case 'import-demo':case 'mock-import-data':case 'risk-data':case 'recognition-csv':note('正式版将打开相应文件选择器；草图不会读取本地数据。');break;
 case 'prefix-check':note('正式版先评估冻结分类器的前缀表现，再决定是否训练风险头。');break;
 case 'recognition-start':note('识别入口演示，不调用真实模型。');break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderRows()}});
document.addEventListener('change',e=>{if(page==='train'&&trainingStage==='one')updateJobs()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});
render();
})();
</script>
</body>
</html>
